<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Personal Finance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f8fafc; font-family: sans-serif; }
    .card-gradient { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #2563eb 100%); }
  </style>
</head>
<body class="p-4 max-w-md mx-auto min-h-screen flex flex-col justify-between">

  <div>
    <!-- Header -->
    <div class="flex items-center justify-between mb-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-bold shadow-md">
          S
        </div>
        <div>
          <h1 class="text-sm font-semibold text-slate-800 leading-tight">Personal Manager</h1>
          <p class="text-xs text-slate-400">Keuangan Pribadi</p>
        </div>
      </div>
      <button onclick="resetData()" class="text-slate-400 hover:text-red-500 text-sm">
        <i class="fa-solid fa-power-off text-lg"></i>
      </button>
    </div>

    <!-- Sapaan -->
    <div class="mb-4">
      <h2 class="text-xl font-bold text-slate-800">Ringkasan Saldo</h2>
      <p class="text-xs text-slate-500" id="currentDate"></p>
    </div>

    <!-- Main Card Saldo -->
    <div class="card-gradient rounded-3xl p-5 text-white shadow-xl shadow-blue-500/10 mb-6">
      <div class="flex items-center justify-between text-xs text-blue-200 mb-1">
        <span class="flex items-center gap-1.5"><i class="fa-solid fa-shield-halved"></i> TOTAL KEKAYAAN</span>
        <button onclick="toggleVisibility()" class="text-blue-200 focus:outline-none">
          <i id="eyeIcon" class="fa-solid fa-eye"></i>
        </button>
      </div>

      <div class="text-2xl font-bold tracking-tight mb-6" id="totalBalance">Rp 0</div>

      <div class="grid grid-cols-2 gap-3 pt-3 border-t border-white/10">
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 rounded-full bg-emerald-500/20 text-emerald-300 flex items-center justify-center text-xs">
            <i class="fa-solid fa-arrow-down"></i>
          </div>
          <div>
            <div class="text-[10px] text-blue-200">INCOME</div>
            <div class="text-xs font-semibold" id="totalIncome">Rp 0</div>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 rounded-full bg-rose-500/20 text-rose-300 flex items-center justify-center text-xs">
            <i class="fa-solid fa-arrow-up"></i>
          </div>
          <div>
            <div class="text-[10px] text-blue-200">EXPENSE</div>
            <div class="text-xs font-semibold text-rose-200" id="totalExpense">Rp 0</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Form Input Transaksi Cepat -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 mb-6">
      <h3 class="text-xs font-bold text-slate-700 uppercase tracking-wider mb-3">Catat Transaksi Baru</h3>
      <form id="txForm" onsubmit="addTransaction(event)" class="space-y-3">
        <div class="flex gap-2">
          <select id="txType" class="bg-slate-50 border border-slate-200 text-xs rounded-xl p-2.5 flex-1 focus:ring-2 focus:ring-blue-500">
            <option value="income">Pemasukan (+)</option>
            <option value="expense" selected>Pengeluaran (-)</option>
          </select>
          <input type="number" inputmode="numeric" id="txAmount" placeholder="Nominal (Rp)" required class="bg-slate-50 border border-slate-200 text-xs rounded-xl p-2.5 flex-1 focus:ring-2 focus:ring-blue-500">
        </div>
        <input type="text" id="txDesc" placeholder="Keterangan (cth: Makan siang, Gaji)" required class="w-full bg-slate-50 border border-slate-200 text-xs rounded-xl p-2.5 focus:ring-2 focus:ring-blue-500">
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-xl text-xs shadow-md shadow-blue-500/20 transition-all">
          Simpan Transaksi
        </button>
      </form>
    </div>

    <!-- Riwayat Transaksi -->
    <div>
      <h3 class="text-sm font-bold text-slate-800 mb-3">Aktivitas Keuangan</h3>
      <div id="txList" class="space-y-2.5">
        <!-- List item di-render lewat JS -->
      </div>
    </div>
  </div>

  <script>
    let isHidden = false;
    let transactions = JSON.parse(localStorage.getItem('my_tx_data') || '[]');

    document.getElementById('currentDate').innerText = new Date().toLocaleDateString('id-ID', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });

    function formatRupiah(number) {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number);
    }

    function toggleVisibility() {
      isHidden = !isHidden;
      document.getElementById('eyeIcon').className = isHidden ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
      renderUI();
    }

    function addTransaction(e) {
      e.preventDefault();
      const type = document.getElementById('txType').value;
      const amount = parseFloat(document.getElementById('txAmount').value);
      const desc = document.getElementById('txDesc').value;

      if (!amount || amount <= 0) return;

      const newTx = {
        id: Date.now(),
        type,
        amount,
        desc,
        date: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
      };

      transactions.unshift(newTx);
      localStorage.setItem('my_tx_data', JSON.stringify(transactions));
      document.getElementById('txForm').reset();
      renderUI();
    }

    function deleteTransaction(id) {
      transactions = transactions.filter(item => item.id !== id);
      localStorage.setItem('my_tx_data', JSON.stringify(transactions));
      renderUI();
    }

    function resetData() {
      if (confirm('Hapus seluruh riwayat transaksi?')) {
        transactions = [];
        localStorage.removeItem('my_tx_data');
        renderUI();
      }
    }

    function renderUI() {
      let income = 0;
      let expense = 0;

      transactions.forEach(t => {
        if (t.type === 'income') income += t.amount;
        if (t.type === 'expense') expense += t.amount;
      });

      const balance = income - expense;

      document.getElementById('totalBalance').innerText = isHidden ? 'Rp ••••••••' : formatRupiah(balance);
      document.getElementById('totalIncome').innerText = isHidden ? 'Rp ••••••' : formatRupiah(income);
      document.getElementById('totalExpense').innerText = isHidden ? 'Rp ••••••' : formatRupiah(expense);

      const listContainer = document.getElementById('txList');
      if (transactions.length === 0) {
        listContainer.innerHTML = '<div class="text-center text-xs text-slate-400 py-6">Belum ada riwayat transaksi.</div>';
        return;
      }

      listContainer.innerHTML = transactions.map(t => `
        <div class="bg-white p-3 rounded-2xl flex items-center justify-between border border-slate-100 shadow-sm">
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-xl ${t.type === 'income' ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'} flex items-center justify-center text-xs">
              <i class="fa-solid ${t.type === 'income' ? 'fa-arrow-down' : 'fa-arrow-up'}"></i>
            </div>
            <div>
              <div class="text-xs font-semibold text-slate-800">${t.desc}</div>
              <div class="text-[10px] text-slate-400">${t.date}</div>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <span class="text-xs font-bold ${t.type === 'income' ? 'text-emerald-600' : 'text-slate-800'}">
              ${t.type === 'income' ? '+' : '-'} ${isHidden ? '••••' : formatRupiah(t.amount)}
            </span>
            <button onclick="deleteTransaction(${t.id})" class="text-slate-300 hover:text-rose-500 text-xs">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        </div>
      `).join('');
    }

    renderUI();
  </script>
<!-- Footer Rapi di Bawah -->
<div class="text-center text-[11px] text-slate-400 py-6">
  Dibuat oleh <span class="font-semibold text-slate-600">Rezu Project</span> • Personal Manager v1.0
</div>
</body>
</html>
